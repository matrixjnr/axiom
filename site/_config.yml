# Jekyll configuration of the documentation site (docs/site.md). The source is assembled by
# `./gradlew jekyllSource` into build/jekyll, together with _config.generated.yml (version, logo
# and favicon), which is passed as a second configuration file.
title: Axiom
description: A small, strict HTTP framework for Java 21 on virtual threads.
theme: just-the-docs

# GitHub Pages serves the project at /axiom. For a custom domain set url to it and baseurl to "".
url: https://matrixjnr.github.io
baseurl: /axiom

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

# Only what the assembled source contains is published; nothing is fetched while building.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
relative_links:
  enabled: true
  collections: false

markdown: kramdown
kramdown:
  input: GFM          # GitHub's heading ids, so #anchors work on GitHub and on the site
  hard_wrap: false
  syntax_highlighter: rouge

# The documents contain braces that are not Liquid, and need not repeat the layout.
defaults:
  - scope:
      path: "*.md"
    values:
      layout: default
      render_with_liquid: false

search_enabled: true
search:
  heading_level: 3
  previews: 3
  button: true
enable_copy_code_button: true
heading_anchors: true
color_scheme: light   # the dark scheme is added for browsers that prefer it (_includes/head_custom.html)

aux_links:
  GitHub:
    - https://github.com/matrixjnr/axiom
aux_links_new_tab: true

# The aggregated Javadoc is copied to api/ after the build.
nav_external_links:
  - title: API reference
    url: /api/index.html
    opens_in_new_tab: false

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: yellow
callouts_level: quiet
