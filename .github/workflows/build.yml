name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Temurin 21 can measure per-thread allocation; fail instead of skipping if that changes.
      - run: ./gradlew clean check -Daxiom.requireAllocationTests=true
      - run: ./gradlew :examples:hello:run --args="--smoke"
