name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request cancels the run for its previous head. Pushes to main each keep
# their own group, so no main run is cancelled or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Compilation (main, test and benchmark sources), jars, Javadoc and every check task except the
  # tests: architectureTest, checkPublicationCoverage, checkIntegrationTags. Dependency
  # verification applies to every configuration resolved here.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew assemble testClasses javadoc check -x test -x integrationTest
  # The modules that have unit tests, read from the build (`./gradlew unitTestMatrix`), so a new
  # module with tests is picked up without editing this file.
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - id: modules
        run: |
          modules="$(./gradlew -q --console=plain unitTestMatrix | grep '^{"include"')"
          echo "Unit test modules: $modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
  # Fast tests (no real sockets), one job per module that has them.
  unit:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # Temurin 21 can measure per-thread allocation; fail instead of skipping if that changes.
      - run: ./gradlew ${{ matrix.path }}:test -Daxiom.requireAllocationTests=true
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports-${{ matrix.module }}
          path: ${{ matrix.dir }}/build/reports/tests/test/
  # Tests tagged integration (real sockets, live listeners) and the integration-tests module.
  # One job, so the root task picks up every module's integrationTest and keeps their order.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew integrationTest -Daxiom.requireAllocationTests=true
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-reports
          path: '**/build/reports/tests/integrationTest/'
  # Coverage report (runs both test tasks with the JaCoCo agent) and the hello smoke run.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew coverageReport -Daxiom.requireAllocationTests=true
      - if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: build/reports/jacoco/coverageReport/
          if-no-files-found: ignore
      - run: ./gradlew :examples:hello:run --args="--smoke"
  # Branch protection requires a status check named `check`; this job keeps that name and passes
  # only when every job above succeeded.
  check:
    if: always()
    needs: [build, matrix, unit, integration, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A needed job ended with result '$result'."
              exit 1
            fi
          done
  # Every commit of a pull request must build on its own, so history stays bisectable and a
  # dependency never lands before its checksums. At most 20 commits are built; a longer series
  # is reduced to the commits that touch build files (see .github/scripts/check-each-commit.sh).
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Build each commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_COMMAND: ./gradlew clean check --max-workers=2 --no-build-cache -Daxiom.requireAllocationTests=true
        run: |
          # Run a copy: the script must not change while commits are checked out under it.
          cp .github/scripts/check-each-commit.sh "$RUNNER_TEMP/check-each-commit.sh"
          "$RUNNER_TEMP/check-each-commit.sh" "$BASE_SHA" "$HEAD_SHA"
