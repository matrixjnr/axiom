name: Release
# Skeleton: builds and verifies a tagged release and keeps the unsigned artifacts as a workflow
# artifact. It does not publish or create a GitHub release; see docs/releasing.md.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Tag must match the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match project version $version" >&2
            exit 1
          fi
          case "$version" in *-SNAPSHOT) echo "Refusing to release a SNAPSHOT version" >&2; exit 1;; esac
      - run: ./gradlew clean check --no-build-cache
      - run: mvn --version
      - run: ./gradlew compatibilityTest --no-build-cache
      - name: Collect artifacts
        run: ./gradlew publishCompatRepo --no-build-cache
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maven-repository
          path: build/compat-repo
          if-no-files-found: error
