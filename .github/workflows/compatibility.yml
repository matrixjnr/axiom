name: Compatibility
# Builds Gradle (Kotlin and Groovy DSL) and Maven consumer projects against locally published
# artifacts. Slow, so it is not part of the Build workflow.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # The Maven consumer is skipped silently by Gradle when mvn is missing; fail here instead.
      - run: mvn --version
      - run: ./gradlew compatibilityTest --no-build-cache
