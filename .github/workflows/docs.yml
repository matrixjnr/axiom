name: Docs
# Builds the documentation site (docs/site.md) and deploys it to GitHub Pages. Pull requests only
# build it and keep the result as an artifact; a push to main (or a manual run on main) deploys.
# This workflow is separate from build.yml: the aggregate `check` job does not depend on it. The
# repository must have Settings -> Pages -> Source set to "GitHub Actions" for the deploy job.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - '**/src/main/java/**'
      - 'build.gradle.kts'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - '**/src/main/java/**'
      - 'build.gradle.kts'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels the run for its previous head.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Pages, aggregated Javadoc and the link and anchor check (`./gradlew docsSite`).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - run: ./gradlew docsSite
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
          retention-days: 7
  # Only pushes to main (and manual runs on main) deploy. One deployment at a time, never
  # cancelled half way.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
