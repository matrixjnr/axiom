name: Docs
# Builds the documentation site (docs/site.md: Jekyll with the just-the-docs theme, both pinned by
# site/Gemfile.lock, plus the aggregated Javadoc) and deploys it to GitHub Pages. Pull requests only
# build it and keep the result as an artifact; a push to main (or a manual run on main) deploys.
# This workflow is separate from build.yml: the aggregate `check` job does not depend on it. The
# repository must have Settings -> Pages -> Source set to "GitHub Actions" for the deploy job.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'site/**'
      - 'branding/**'
      - '**/src/main/java/**'
      - 'build.gradle.kts'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'site/**'
      - 'branding/**'
      - '**/src/main/java/**'
      - 'build.gradle.kts'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels the run for its previous head.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Jekyll source and aggregated Javadoc (Gradle), the site (Jekyll), and the link and anchor checks.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # Fails on a broken link or anchor in the Markdown, then writes build/jekyll and build/docs-api.
      - run: ./gradlew checkDocsLinks jekyllSource aggregateJavadoc
      # Gems come from site/Gemfile.lock only, installed with the lock frozen (hashes verified).
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
          working-directory: site
      # The address GitHub Pages serves the site at: the project address (base path /axiom) or a custom
      # domain (empty base path). Without it every stylesheet and link of a site on a custom domain
      # would point under /axiom and return 404. Pull requests that cannot read the Pages settings fall
      # back to the project address.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true
      - name: Site address
        id: address
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$PAGES_OUTCOME" = success ] && [ -n "$PAGES_ORIGIN" ]; then
            origin="$PAGES_ORIGIN"; base="$PAGES_BASE_PATH"
          else
            origin=https://matrixjnr.github.io; base=/axiom
          fi
          echo "Serving the site at ${origin}${base}/"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - run: site/build.sh
        env:
          AXIOM_SITE_URL: ${{ steps.address.outputs.origin }}
          AXIOM_SITE_BASEURL: ${{ steps.address.outputs.base }}
      - run: ./gradlew checkSiteLinks -Paxiom.site.url="$ORIGIN" -Paxiom.site.baseUrl="$BASE"
        env:
          ORIGIN: ${{ steps.address.outputs.origin }}
          BASE: ${{ steps.address.outputs.base }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
          retention-days: 7
  # Only pushes to main (and manual runs on main) deploy. One deployment at a time, never
  # cancelled half way.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
