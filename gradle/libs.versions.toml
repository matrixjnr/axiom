[versions]
junit = "6.1.3"
assertj = "3.27.7"
jmh = "1.37"
netty = "4.2.20.Final"
jackson = "2.23.0"
jakarta-validation = "3.1.1"
hibernate-validator = "9.1.6.Final"
# JaCoCo agent and report tool, used through the Gradle jacoco plugin (toolVersion).
jacoco = "0.8.15"
# Swagger UI static files, packaged as a WebJar and served by axiom-openapi-ui (no CDN at run time).
swagger-ui = "5.34.1"
# Checkstyle, used through the Gradle checkstyle plugin (toolVersion).
checkstyle = "14.3.0"
# Formatting gate applied by Spotless to every Java source.
google-java-format = "2.0.0"
japicmp = "0.27.0"
asm = "9.11.1"
# Adapter dependencies are opt-in: only axiom-otel and axiom-metrics-micrometer resolve them.
opentelemetry = "1.68.0"
micrometer = "1.18.0"
# gRPC adapter artifacts are opt-in: only axiom-grpc resolves them. Netty is shaded into
# grpc-netty-shaded, so it cannot clash with the unshaded Netty of axiom-http.
grpc = "1.86.0"
# Aligned with grpc-protobuf 1.86.0.
protobuf = "3.25.9"
# Adapter dependency: graphql-java and its own transitive libraries stay inside axiom-graphql.
graphql-java = "26.2"
# Adapter dependency: only the JTA API is pinned here; an actual transaction manager is application-owned.
jakarta-transaction = "2.0.1"
# Adapter dependencies: Jakarta Persistence stays inside axiom-jpa; a provider resolves for tests only.
jakarta-persistence = "3.2.0"
hibernate = "7.4.16.Final"

[libraries]
japicmp = { module = "com.github.siom79.japicmp:japicmp", version.ref = "japicmp" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
swagger-ui = { module = "org.webjars:swagger-ui", version.ref = "swagger-ui" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-http = { module = "io.netty:netty-codec-http" }
# HTTP/2 is opt-in through ListenerOptions.http2; axiom-core has no transport dependency.
netty-http2 = { module = "io.netty:netty-codec-http2" }
netty-handler = { module = "io.netty:netty-handler" }
# Compile-time only: the optional native transports (the native libraries are not dependencies of axiom-http).
netty-classes-epoll = { module = "io.netty:netty-transport-classes-epoll" }
netty-classes-kqueue = { module = "io.netty:netty-transport-classes-kqueue" }
netty-classes-iouring = { module = "io.netty:netty-transport-classes-io_uring" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version.ref = "hibernate-validator" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
# Test only: in-memory exporters and readers, never on an adapter's published classpath.
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
# Test only: in-process server and channel; no socket is opened by the gRPC tests.
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
graphql-java = { module = "com.graphql-java:graphql-java", version.ref = "graphql-java" }
jakarta-transaction-api = { module = "jakarta.transaction:jakarta.transaction-api", version.ref = "jakarta-transaction" }
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakarta-persistence" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate" }
